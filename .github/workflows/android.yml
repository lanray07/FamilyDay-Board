name: Android verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: chmod +x gradlew && ./gradlew assembleDebug assembleRelease lintDebug testDebugUnitTest --console=plain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend -v && python -m unittest discover -s tools -v && python tools/localize.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-unit-tests
          path: |
            app/build/outputs/apk/
            app/build/reports/
  tablet-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - tablet: 7-inch-api28
            api: 28
            size: 1024x600
            density: 160
          - tablet: 8-inch-api30
            api: 30
            size: 1280x800
            density: 213
          - tablet: 10-inch-api35
            api: 35
            size: 1920x1200
            density: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            bash tools/tablet-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.tablet }}-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            captures/
